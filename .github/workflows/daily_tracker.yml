name: Daily Market Tracker

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write # Permiso explícito para hacer commit/push

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar código con la versión v4
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurar Python con la versión v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar dependencias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Ejecutar el script
    - name: Run Market Tracker Script
      run: python main.py

    # 5. Guardar los cambios
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add market_history.json
        git commit -m "auto: actualización diaria de datos de mercado [skip ci]" || exit 0
        git push