name: Daily Market Tracker

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (9:00 AM hora de Argentina)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde GitHub cuando quieras

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código del repositorio a la máquina virtual
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Configurar Python en el servidor
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instalar dependencias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Ejecutar el script
    - name: Run Market Tracker Script
      run: python main.py

    # 5. Guardar los cambios (market_history.json) de vuelta en GitHub
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add market_history.json
        git commit -m "auto: actualización diaria de datos de mercado [skip ci]" || exit 0
        git push